<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Easypay | Log in</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth.css">
  <script src="auth.js" defer></script>
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-brand">
        <img src="easypay-logo.png" alt="Easypay logo">
        <span>easypay</span>
      </div>
      <h1>Welcome back</h1>
      <p>Log in to your demo wallet.</p>

      <form id="loginForm">
        <label for="identifier">Email or mobile number</label>
        <input id="identifier" name="identifier" type="text"
               placeholder="name@mail.com or 03XXXXXXXXX"
               autocomplete="username" required>

        <label for="pin">PIN</label>
        <input id="pin" name="pin" type="password" inputmode="numeric"
               maxlength="5" autocomplete="current-password" required>

        <button class="auth-button" type="submit">Log in</button>
        <div class="auth-message" id="authMessage"></div>
      </form>

      <div class="auth-switch">
        New here? <a href="register.html">Create an account</a>
      </div>
    </section>
  </main>
</body>
</html>
